[project]
name = "finch-map-renderer"
version = "0.1.0"
description = "Offline map and terrain renderer for Finch2"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=10",
    "pyogrio>=0.9",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
